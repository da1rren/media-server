volumes:
  torrent:
  movies:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=unas-4.localdomain,nolock,soft,rw"
      device: ":/var/nfs/shared/media/movies"

  shows:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=unas-4.localdomain,nolock,soft,rw"
      device: ":/var/nfs/shared/media/shows"

  torrents:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=unas-4.localdomain,nolock,soft,rw"
      device: ":/var/nfs/shared/torrents"

  downloading:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=unas-4.localdomain,nolock,soft,rw"
      device: ":/var/nfs/shared/downloading"

services:
  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    restart: 'unless-stopped'

  protonvpn:
    image: docker.io/qmcgaw/gluetun:latest
    container_name: media-protonvpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c '/usr/bin/wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}},\"current_network_interface\":\"tun0\"}" http://127.0.0.1:${QBITTORRENT_WEBUI_PORT}/api/v2/app/setPreferences 2>&1'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c '/usr/bin/wget -O- --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:${QBITTORRENT_WEBUI_PORT}/api/v2/app/setPreferences 2>&1'
    volumes:
      - /home/jellyfin/vpn:/gluetun
    ports:
      - ${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: media-qbittorrent
    restart: 'unless-stopped'
    network_mode: "service:protonvpn"
    depends_on:
      - protonvpn
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT}
      - TORRENTING_PORT=6881
    volumes:
      - torrent:/config
      - movies:/content/movies
      - shows:/content/shows
      - downloading:/downloads
      - torrents:/media/torrents
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: "256M"

  jellyfin:
    image: docker.io/jellyfin/jellyfin:latest
    container_name: media-jellyfin
    volumes:
      - /home/jellyfin/config:/config
      - /home/jellyfin/cache:/cache
      - shows:/media/shows
      - movies:/media/movies
    devices:
      - /dev/dri/:/dev/dri/
    restart: 'unless-stopped'
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.loveand.coffee/
    deploy:
      resources:
        reservations:
          cpus: "2"
          memory: "6G"

  radarr:
    container_name: media-radarr
    image: ghcr.io/hotio/radarr
    restart: 'unless-stopped'
    ports:
      - "7878:7878"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - /home/jellyfin/radarr/config:/config
      - /home/jellyfin/radarr/data:/data
      - downloading:/downloads
      - movies:/content/movies
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: "256M"

  sonarr:
    container_name: media-sonarr
    image: ghcr.io/hotio/sonarr
    restart: 'unless-stopped'
    ports:
      - "8989:8989"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - /home/jellyfin/sonarr/config:/config
      - /home/jellyfin/sonarr/data:/data
      - downloading:/downloads
      - shows:/content/shows
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: "256M"

  unpackerr:
    container_name: media-unpackerr
    image: ghcr.io/unpackerr/unpackerr:latest
    restart: 'unless-stopped'
    volumes:
      - downloading:/downloads
      - shows:/content/shows
      - movies:/content/movies
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
      ## Sonarr Settings
      - UN_SONARR_0_URL=http://media-sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATHS_0=/downloads
      - UN_SONARR_0_PROTOCOLS=torrent,TorrentDownloadProtocol
      - UN_SONARR_0_TIMEOUT=10s
      - UN_SONARR_0_DELETE_DELAY=5m
      - UN_SONARR_0_DELETE_ORIG=false
      - UN_SONARR_0_SYNCTHING=false
      ## Radarr Settings
      - UN_RADARR_0_URL=http://media-radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATHS_0=/downloads
      - UN_RADARR_0_PROTOCOLS=torrent,TorrentDownloadProtocol
      - UN_RADARR_0_TIMEOUT=10s
      - UN_RADARR_0_DELETE_DELAY=5m
      - UN_RADARR_0_DELETE_ORIG=false
      - UN_RADARR_0_SYNCTHING=false

  jackett:
    container_name: media-jackett
    image: ghcr.io/hotio/jackett
    restart: 'unless-stopped'
    ports:
      - "9117:9117"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - /home/jellyfin/jackett/config:/config
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: "256M"

  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - /home/jellyfin/ha/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host
    devices:
      - /dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_aa262c124df3ef118184c41b6d9880ab-if00-port0:/dev/ttyUSB0
    environment:
      - TZ=${TZ}

